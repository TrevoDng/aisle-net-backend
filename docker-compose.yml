services:
  postgres:
    image: postgres:15-alpine
    container_name: aisle-net-postgres
    networks:
      - app-network
    environment:
      POSTGRES_DB: aisle_net_db
      POSTGRES_USER: trevor
      POSTGRES_PASSWORD: Trev@1684716
    ports:
      - "5434:5432"  # Changed to match your .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trevor -d aisle_net_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aisle-net-redis
    networks:
      - app-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: aisle-net-backend
    networks:
      - app-network
    ports:
      - "3001:3001"  # Changed to match your .env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=postgres  # In Docker, use service name
      - DB_PORT=5432      # In Docker, Postgres uses default port
      - DB_NAME=aisle_net_db
      - DB_USER=trevor
      - DB_PASSWORD=Trev@1684716
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=1h
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - PAYFAST_MERCHANT_ID=${PAYFAST_MERCHANT_ID}
      - PAYFAST_MERCHANT_KEY=${PAYFAST_MERCHANT_KEY}
      - PAYFAST_PASSPHRASE=${PAYFAST_PASSPHRASE}
      - YOCO_SECRET_KEY=${YOCO_SECRET_KEY}
      - YOCO_PUBLIC_KEY=${YOCO_PUBLIC_KEY}
      - YOCO_WEBHOOK_SECRET=${YOCO_WEBHOOK_SECRET}
      - OZOW_SITE_CODE=${OZOW_SITE_CODE}
      - OZOW_PRIVATE_KEY=${OZOW_PRIVATE_KEY}
      - OZOW_API_KEY=${OZOW_API_KEY}
      - APP_URL=http://localhost:3001
      - FRONTEND_URL=http://localhost:3000
      - SUCCESS_URL=http://localhost:3000/payment/success
      - CANCEL_URL=http://localhost:3000/payment/cancel
      - OZOW_NOTIFY_URL=http://localhost:3001/api/webhooks/ozow
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: /home/treor/smart-shopper
      dockerfile: Dockerfile.simple
    container_name: aisle-net-frontend
    networks:
      - app-network
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: